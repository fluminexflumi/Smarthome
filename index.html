<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Smarthome</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="layouts.css">
  <link rel="stylesheet" href="layouts2.css">
</head>
<body>
  <div class="bg-scene" id="bgscene" aria-hidden="true"></div>
  <div class="app">
    <!-- Kopfzeile -->
    <header class="topbar">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M5 19 20 6l15 13"/><path d="M9 16v17h22V16"/><path d="M17 33v-8h6v8"/></svg>
        <div>
          <div class="brand-name">Smarthome</div>
          <div class="brand-sub">Smarthome, einfach gesteuert</div>
        </div>
      </div>
      <div class="status-pills" id="pills"></div>
      <div class="top-right">
        <button class="icon-btn" id="bell" aria-label="Hinweise">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="badge" id="bell-badge" hidden></span>
        </button>
        <div class="user">
          <div class="avatar">T</div>
          <div class="user-text"><div class="user-name">Toni</div><div class="user-sub">Zuhause</div></div>
        </div>
      </div>
    </header>

    <!-- Navigation -->
    <nav class="sidebar" aria-label="Bereiche">
      <button class="nav-item active" data-view="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg><span>Home</span></button>
      <button class="nav-item" data-view="licht"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span>Licht</span></button>
      <button class="nav-item" data-view="rollos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 8h16M4 12h16"/><path d="M12 12v4"/></svg><span>Rollos</span></button>
      <button class="nav-item" data-view="sauger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M7 6.5h10"/></svg><span>Sauger</span></button>
      <button class="nav-item" data-view="szenen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>Szenen</span></button>
      <button class="nav-item" data-view="musik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>Musik</span></button>
      <button class="nav-item" data-view="kalender"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Kalender</span></button>
      <button class="nav-item" data-view="layouts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 10h18M10 10v11"/></svg><span>Layouts</span></button>
    </nav>

    <main id="view"></main>

    <footer class="foot">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 8C8 10 5.9 16.2 3.8 21.3l1.9.7.9-2.3c.5.2 1 .3 1.4.3C19 20 22 3 22 3c-1 2-8 2.3-13 3.3S2 11.5 2 13.5s1.8 3.8 1.8 3.8C7 8 17 8 17 8z"/></svg>
      <span>Läuft lokal im Heimnetz</span><span class="sep">·</span><span id="foot-updated"></span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script src="layouts.js"></script>
  <script src="layouts2.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
